        const API_URL = 'http://localhost:8000'; // ajuste selon ton `php artisan serve`

        Pusher.logToConsole = true;

        const pusher = new Pusher('chatkey', { // = REVERB_APP_KEY dans ton .env
            wsHost: 'localhost',
            wsPort: 8080,
            forceTLS: false,
            enabledTransports: ['ws'],
            cluster: '',
            authorizer: (channel) => ({
                authorize: (socketId, callback) => {
                    fetch(`${API_URL}/broadcasting/auth`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${TOKEN}`,
                            'Accept': 'application/json',
                        },
                        body: JSON.stringify({
                            socket_id: socketId,
                            channel_name: channel.name,
                        }),
                    })
                    .then(res => res.json())
                    .then(data => callback(false, data))
                    .catch(err => callback(true, err));
                }
            })
        });

        const channel = pusher.subscribe('private-chat.general');

        channel.bind('pusher:subscription_succeeded', () => {
            console.log('✅ Abonné au canal avec succès');
        });

        channel.bind('pusher:subscription_error', (err) => {
            console.error('❌ Erreur d\'abonnement:', err);
        });

        channel.bind('.message.sent', (data) => {
            const li = document.createElement('li');
            li.textContent = `${data.user.name}: ${data.content}`;
            document.getElementById('messages').appendChild(li);
        });

        function sendMessage() {
            const content = document.getElementById('content').value;
            fetch(`${API_URL}/api/chat/messages`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${TOKEN}`,
                    'Accept': 'application/json',
                },
                body: JSON.stringify({ content, room: 'general' }),
            })
            .then(res => res.json())
            .then(data => console.log('Message envoyé:', data));
        }
    </script>
</body>
