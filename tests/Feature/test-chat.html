        const CONVERSATION_ID = 6; // ← l'id retourné par ta création de conversation
        const API_URL = 'http://localhost:8000';

        Pusher.logToConsole = true;

        const pusher = new Pusher('chatkey', {
            wsHost: 'localhost',
            wsPort: 8080,
            forceTLS: false,
            enabledTransports: ['ws'],
            cluster: '',
            authorizer: (channel) => ({
                authorize: (socketId, callback) => {
                    fetch(`${API_URL}/broadcasting/auth`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${TOKEN}`,
                            'Accept': 'application/json',
                        },
                        body: JSON.stringify({ socket_id: socketId, channel_name: channel.name }),
                    })
                    .then(res => res.json())
                    .then(data => callback(false, data))
                    .catch(err => callback(true, err));
                }
            })
        });

        const channel = pusher.subscribe(`private-conversation.${CONVERSATION_ID}`);

        channel.bind('pusher:subscription_succeeded', () => {
            console.log('✅ Abonné à la conversation', CONVERSATION_ID);
        });

        channel.bind('pusher:subscription_error', (err) => {
            console.error('❌ Erreur abonnement:', err);
        });

        channel.bind('.message.sent', (data) => {
            const li = document.createElement('li');
            li.textContent = `${data.user.name}: ${data.content}`;
            document.getElementById('messages').appendChild(li);
        });

        function sendMessage() {
            const content = document.getElementById('content').value;
            fetch(`${API_URL}/api/conversations/${CONVERSATION_ID}/messages`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${TOKEN}`,
                    'Accept': 'application/json',
                },
                body: JSON.stringify({ content }),
            })
            .then(res => res.json())
            .then(data => {
                console.log('Message envoyé:', data);
                const li = document.createElement('li');
                li.textContent = `Moi: ${content}`;
                document.getElementById('messages').appendChild(li);
                document.getElementById('content').value = '';
            });
        }
    </script>
</body>
</html>
